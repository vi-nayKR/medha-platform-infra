apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: db-migration
          image: local-registry:5000/medha-api:latest
          imagePullPolicy: IfNotPresent
          command: ["./medha-api", "-migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: database-url
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 300m, memory: 256Mi}
      containers:
        - name: backend
          image: local-registry:5000/medha-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: database-url
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: admin-username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: admin-password
            - name: ADMIN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: admin-api-token
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: resend-api-key
            - name: MESSAGECENTRAL_CUSTOMER_ID
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: messagecentral-customer-id
            - name: MESSAGECENTRAL_KEY_BASE64
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: messagecentral-key-base64
            - name: MESSAGECENTRAL_EMAIL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: messagecentral-email
            - name: MAPMYINDIA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: mapmyindia-client-id
            - name: MAPMYINDIA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: mapmyindia-client-secret
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - name: jwt-keys
              mountPath: /app/keys
              readOnly: true
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
