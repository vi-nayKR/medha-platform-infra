apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  template:
    spec:
      initContainers:
        - name: db-migration
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-dev-secrets
                  key: database-url
      containers:
        - name: backend
          env:
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: backend-dev-secrets, key: database-url}}}
            - {name: S3_ACCESS_KEY, valueFrom: {secretKeyRef: {name: backend-dev-secrets, key: s3-access-key}}}
            - {name: S3_SECRET_KEY, valueFrom: {secretKeyRef: {name: backend-dev-secrets, key: s3-secret-key}}}
            - {name: ADMIN_USERNAME, valueFrom: {secretKeyRef: {name: backend-dev-secrets, key: admin-username}}}
            - {name: ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: backend-dev-secrets, key: admin-password}}}
            - {name: ADMIN_API_TOKEN, valueFrom: {secretKeyRef: {name: backend-dev-secrets, key: admin-api-token}}}
            - {name: RESEND_API_KEY, valueFrom: {secretKeyRef: {name: backend-dev-secrets, key: resend-api-key}}}
            - {name: MESSAGECENTRAL_CUSTOMER_ID, valueFrom: {secretKeyRef: {name: backend-dev-secrets, key: messagecentral-customer-id}}}
            - {name: MESSAGECENTRAL_KEY_BASE64, valueFrom: {secretKeyRef: {name: backend-dev-secrets, key: messagecentral-key-base64}}}
            - {name: MESSAGECENTRAL_EMAIL, valueFrom: {secretKeyRef: {name: backend-dev-secrets, key: messagecentral-email}}}
            - {name: MAPMYINDIA_CLIENT_ID, valueFrom: {secretKeyRef: {name: backend-dev-secrets, key: mapmyindia-client-id}}}
            - {name: MAPMYINDIA_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: backend-dev-secrets, key: mapmyindia-client-secret}}}
            - {name: DEV_PANDIT_PHONE, valueFrom: {secretKeyRef: {name: backend-dev-secrets, key: dev-pandit-phone}}}
            - {name: DEV_YAJMAN_PHONE, valueFrom: {secretKeyRef: {name: backend-dev-secrets, key: dev-yajman-phone}}}

