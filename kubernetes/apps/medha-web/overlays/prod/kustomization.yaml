apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
patches:
  - path: bundle-revision-patch.yaml
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: medha-web
      spec:
        template:
          spec:
            nodeSelector:
              workload-type: worker
            volumes:
              - name: web-root
                hostPath:
                  path: /mnt/ssd/medha-web
                  type: DirectoryOrCreate
