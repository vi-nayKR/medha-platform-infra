apiVersion: v1
kind: ConfigMap
metadata:
  name: medha-admin-panel-nginx-config
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medha-admin-panel
  labels:
    app.kubernetes.io/name: medha-admin-panel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: medha-admin-panel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: medha-admin-panel
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: web-root
              mountPath: /usr/share/nginx/html
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: web-root
          hostPath:
            path: /var/www/medha-admin-panel-dev
            type: DirectoryOrCreate
        - name: nginx-config
          configMap:
            name: medha-admin-panel-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: medha-admin-panel
spec:
  selector:
    app.kubernetes.io/name: medha-admin-panel
  ports:
    - name: http
      port: 80
      targetPort: 80
