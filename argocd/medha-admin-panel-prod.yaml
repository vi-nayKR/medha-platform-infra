apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medha-admin-panel-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vi-nayKR/medha-platform-infra.git
    targetRevision: main
    path: kubernetes/apps/medha-admin-panel/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    syncOptions: [CreateNamespace=true, PruneLast=true]
