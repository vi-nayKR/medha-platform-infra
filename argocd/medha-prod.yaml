apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medha-prod
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-sync-failed.github: vi-nayKR/medha-platform-infra
spec:
  project: default
  source:
    repoURL: https://github.com/vi-nayKR/medha-platform-infra.git
    targetRevision: main
    path: kubernetes/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, PruneLast=true]
