apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medha-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vi-nayKR/medha-platform-infra.git
    targetRevision: main
    path: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
