upstream medha_api_dev { server 10.0.0.10:18082; keepalive 16; }

server {
    listen 80;
    server_name dev.medha.dev;
    root /opt/medha/web/web;
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80;
    server_name admin-dev.medha.dev;
    root /opt/medha/web/admin;
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80;
    server_name api-dev.medha.dev;
    location / {
        proxy_pass http://medha_api_dev;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name s3-dev.medha.dev;
    location / {
        proxy_pass http://127.0.0.1:8333;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server { listen 80; server_name minio-dev.medha.dev; return 410 "MinIO has been replaced by SeaweedFS"; }
