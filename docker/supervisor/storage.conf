[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[supervisord]
nodaemon=true
logfile=/data/logs/supervisord-storage.log
pidfile=/var/run/supervisord.pid
childlogdir=/data/logs

[program:seaweedfs-dev]
command=/usr/local/bin/weed server -dir=/data/seaweedfs-dev -s3 -s3.port=8333 -master.port=9333 -volume.port=18080 -filer.port=8888 -s3.port.iceberg=0 -ip=0.0.0.0
autostart=true
autorestart=true
priority=10
startsecs=10
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/data/logs/seaweedfs-dev.log
stderr_logfile=/data/logs/seaweedfs-dev-err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_backups=3

[program:seaweedfs-prod]
command=/usr/local/bin/weed server -dir=/data/seaweedfs-prod -s3 -s3.port=8334 -master.port=9334 -volume.port=18081 -filer.port=8889 -s3.port.iceberg=0 -ip=0.0.0.0
autostart=true
autorestart=true
priority=10
startsecs=10
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/data/logs/seaweedfs-prod.log
stderr_logfile=/data/logs/seaweedfs-prod-err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_backups=3

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/data/logs/nginx-access.log
stderr_logfile=/data/logs/nginx-error.log

[program:backup-cron]
command=/bin/bash -c "while true; do sleep 86400; /opt/medha/scripts/backup.sh; done"
autostart=true
autorestart=true
priority=90
stdout_logfile=/data/logs/backup.log
stderr_logfile=/data/logs/backup-err.log
