[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[supervisord]
nodaemon=true
logfile=/data/logs/supervisord-worker.log
pidfile=/var/run/supervisord.pid
childlogdir=/data/logs

[program:postgres-dev]
command=/usr/lib/postgresql/17/bin/postgres -D /data/postgres-dev -c port=5432 -c listen_addresses=127.0.0.1,10.0.0.10 -c max_connections=50 -c shared_buffers=128MB -c logging_collector=on -c log_directory=/data/logs -c log_filename=postgres-dev.log
user=postgres
autostart=true
autorestart=true
priority=10
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/data/logs/postgres-dev-stdout.log
stderr_logfile=/data/logs/postgres-dev-stderr.log

[program:postgres-prod]
command=/usr/lib/postgresql/17/bin/postgres -D /data/postgres-prod -c port=5433 -c listen_addresses=127.0.0.1,10.0.0.10 -c max_connections=100 -c shared_buffers=256MB -c logging_collector=on -c log_directory=/data/logs -c log_filename=postgres-prod.log
user=postgres
autostart=true
autorestart=true
priority=10
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/data/logs/postgres-prod-stdout.log
stderr_logfile=/data/logs/postgres-prod-stderr.log

[program:redis-dev]
command=/usr/bin/redis-server --port 6379 --bind 127.0.0.1 --dir /data/redis-dev --appendonly yes --save 60 1 --maxmemory 128mb --maxmemory-policy allkeys-lru
autostart=true
autorestart=true
priority=20
stopasgroup=true
killasgroup=true
stdout_logfile=/data/logs/redis-dev.log
stderr_logfile=/data/logs/redis-dev-err.log

[program:redis-prod]
command=/usr/bin/redis-server --port 6380 --bind 127.0.0.1 --dir /data/redis-prod --appendonly yes --save 60 1 --maxmemory 256mb --maxmemory-policy allkeys-lru
autostart=true
autorestart=true
priority=20
stopasgroup=true
killasgroup=true
stdout_logfile=/data/logs/redis-prod.log
stderr_logfile=/data/logs/redis-prod-err.log

[program:backend-dev]
command=/opt/medha/scripts/run-backend-dev.sh
autostart=true
autorestart=true
priority=40
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/data/logs/backend-dev.log
stderr_logfile=/data/logs/backend-dev-err.log

[program:backend-prod]
command=/opt/medha/scripts/run-backend-prod.sh
autostart=true
autorestart=true
priority=40
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/data/logs/backend-prod.log
stderr_logfile=/data/logs/backend-prod-err.log
